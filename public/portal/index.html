  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website">

  <meta property="og:title" content="BlueGate Store — مرجع تخصصی اشتراک‌های دیجیتال &amp; هوش مصنوعی">
  <meta property="og:description" content="خرید مستقیم انواع اکانت‌های ChatGPT Plus، تلگرام پرمیوم، اسپاتیفای و اشتراک‌های پرکاربرد با تحویل فوری ۲۴ ساعته">
  <meta property="og:site_name" content="BlueGate Store">
  <meta property="og:locale" content="fa_IR">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BlueGate Store — مرجع تخصصی اشتراک‌های دیجیتال &amp; هوش مصنوعی">
  <meta name="twitter:description" content="خرید مستقیم انواع اکانت‌های ChatGPT Plus، تلگرام پرمیوم، اسپاتیفای با تحویل فوری ۲۴ ساعته">

  <!-- Schema.org JSON-LD Structured Data for Google Rich Snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineStore",
    "name": "BlueGate Store",
    "url": "https://bluegatestore.online/",
    "description": "مرجع تخصصی خرید انواع اکانت‌های دیجیتال، چت جی پی تی پرمیوم و تلگرام پرمیوم",
    "currenciesAccepted": "IRT, IRR",
    "paymentAccepted": "Online Card, Wallet, Crypto",
    "priceRange": "$$"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=v22.0-ceo-perf-fix">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="web-header">
    <div class="header-container">
      <a href="#" class="brand-logo" data-tab="shop">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">BlueGate <small>Store</small></span>
      </a>

      <div class="header-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="جستجو در محصولات، اکانت‌ها، هوش مصنوعی..." autocomplete="off">
      </div>

      <nav class="header-nav">
        <button class="nav-link active" data-tab="shop"><span>🛍️</span> فروشگاه</button>
        <button class="nav-link" data-tab="orders"><span>📜</span> سفارش‌ها</button>
        <button class="nav-link" data-tab="wallet"><span>💰</span> کیف پول &amp; گردونه</button>
      </nav>

      <div class="header-actions">
        <button class="cart-trigger-btn" id="open-cart-btn">
          <span>🛒</span>
          <span class="cart-badge-count" id="cart-count">0</span>
        </button>
        <button class="user-account-btn" id="user-btn">
          <span>👤</span> <b id="user-btn-text">ورود / حساب</b>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Mount Shell -->
  <main id="app" class="web-app-shell">
    <!-- Views dynamically rendered by app.js -->
  </main>

  <!-- Slide-Over Cart Drawer -->
  <aside id="cart-drawer" class="cart-drawer">
    <div class="drawer-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <h3 style="margin:0;">🛒 سبد خرید شما</h3>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="clear-cart-btn" style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:5px 10px; border-radius:10px; font-size:11px; font-weight:800; cursor:pointer; display:none;" title="حذف همه محصولات">🗑️ خالی کردن</button>
        <button class="close-drawer-btn" id="close-cart-btn">✕</button>
      </div>
    </div>
    <div class="drawer-body" id="cart-items-container">
      <!-- Cart items rendered dynamically -->
    </div>
    <div class="drawer-footer" id="cart-footer-container">
      <!-- Checkout summary rendered dynamically -->
    </div>
  </aside>
  <div id="cart-backdrop" class="drawer-backdrop"></div>

  <!-- Global Modal Dialog Backdrop -->
  <div id="modal-container" class="modal-container hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Script -->
  <script src="app.js?v=v22.0-ceo-perf-fix" defer></script>
</body>
</html>
