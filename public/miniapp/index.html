<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#06101d">
  <title>BlueGate</title>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Asset cache keys are rewritten at runtime from each file's filemtime. -->
  <!-- UI layers: design system -> tokens -> foundation -> base -> feature -> parity -> polish. -->
  <link rel="stylesheet" href="/design-system.css?v=0">
  <link rel="stylesheet" href="tokens.css?v=0">
  <link rel="stylesheet" href="foundation.css?v=0">
  <link rel="stylesheet" href="style.css?v=20261012-referral-settings-1">
  <link rel="stylesheet" href="unified.css?v=0">
  <link rel="stylesheet" href="purchase.css?v=0">
  <link rel="stylesheet" href="web-parity.css?v=0">
  <link rel="stylesheet" href="mobile-v292.css?v=0">
  <link rel="stylesheet" href="contrast-guard.css?v=0">
  <link rel="stylesheet" href="layer-stack.css?v=0">
  <link rel="stylesheet" href="motion.css?v=0">
  <link rel="stylesheet" href="design-sync.css?v=0">
  <link rel="stylesheet" href="component-parity.css?v=0">
  <link rel="stylesheet" href="bluegate-theme.css?v=0">
  <link rel="stylesheet" href="admin-web-parity.css?v=0">
  <link rel="stylesheet" href="final-polish.css?v=0">
  <link rel="stylesheet" href="responsive-v3.css?v=0">
  <link rel="stylesheet" href="overlay-safety-v3.css?v=0">
  <link rel="stylesheet" href="interaction-v5.css?v=0">
  <link rel="stylesheet" href="accessibility-v6.css?v=0">
  <link rel="stylesheet" href="performance-v7.css?v=0">
  <link rel="stylesheet" href="catalog-consistency-v8.css?v=0">
  <link rel="stylesheet" href="orders-v9.css?v=0">
</head>
<body>
  <div id="status" class="toast hidden" role="status" aria-live="polite"></div>

  <main id="userApp" class="app-shell" role="main">
    <header class="topbar glass">
      <div class="brand-box">
        <small id="helloText">سلام 👋</small>
        <h1 id="brandTitle">فروشگاه</h1>
      </div>

      <nav class="topbar-desktop-nav">
        <button data-tab="shop" class="active"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/></svg></span> فروشگاه</button>
        <button data-tab="orders"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span> سفارش‌ها</button>
        <button data-tab="wallet"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v4"/><path d="M3 7.5V18a2 2 0 0 0 2 2h15V9H5.5A2.5 2.5 0 0 1 3 6.5"/><circle cx="16.5" cy="14.5" r="1.1"/></svg></span> اعتبار</button>
        <button data-tab="support"><span class="nav-icon">💬</span> تیکت</button>
        <button data-tab="home"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span> حساب</button>
      </nav>

      <div class="topbar-actions">
        <button class="icon-btn mini-notification-btn hidden" id="miniNotificationsBtn" aria-label="اعلان‌ها"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4s2-1.5 2-7.5"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span id="miniNotificationBadge" class="mini-notification-badge hidden">0</span></button>
        <button class="auth-top-btn hidden" id="openAuthModalBtn" title="ورود / ثبت نام">ورود / ثبت‌نام</button>
      </div>
    </header>

    <section id="homePage" class="page"></section>
    <section id="shopPage" class="page hidden"></section>
    <section id="ordersPage" class="page hidden"></section>
    <section id="walletPage" class="page hidden"></section>
    <section id="supportPage" class="page hidden"></section>

    <nav class="bottom-nav glass" role="navigation" aria-label="ناوبری پایین">
      <button data-tab="shop" class="active"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/></svg></span>فروشگاه</button>
      <button data-tab="orders"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>سفارش‌ها</button>
      <button data-tab="wallet"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v4"/><path d="M3 7.5V18a2 2 0 0 0 2 2h15V9H5.5A2.5 2.5 0 0 1 3 6.5"/><circle cx="16.5" cy="14.5" r="1.1"/></svg></span>اعتبار</button>
      <button data-tab="support"><span class="nav-icon">💬</span>تیکت</button>
      <button data-tab="home"><span class="nav-icon"><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>حساب</button>
    </nav>
  </main>

  <main id="adminApp" class="app-shell hidden admin-shell">
    <header class="topbar glass">
      <div>
        <small>پنل مدیریت Mini App</small>
        <h1>BlueGate Admin</h1>
      </div>
      <button class="icon-btn" id="openCmdPalette" title="جستجوی دستور (⌘K)" aria-label="جستجوی دستور">⌘</button>
      <button class="icon-btn" id="reloadAdmin" aria-label="رفرش پنل">↻</button>
    </header>
    <section id="adminStats" class="stats-grid"></section>
    <nav class="admin-tabs glass">
      <button data-admin-tab="dashboard" class="active"><span><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg></span> داشبورد</button>
      <button data-admin-tab="catalog"><span><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></svg></span> کاتالوگ</button>
      <button data-admin-tab="orders"><span><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span> سفارش‌ها</button>
      <button data-admin-tab="more"><span><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></span> بیشتر</button>
    </nav>
    <section id="adminContent" class="admin-content"></section>
  </main>

  <div id="lightbox" class="lightbox"></div>
  <div id="cartSheet" class="cart-sheet"></div>
  <button id="cartFab" class="cart-fab hidden"><span><svg class="bg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h3l2.6 12a2 2 0 0 0 2 1.5h7.6a2 2 0 0 0 2-1.5L21 7.5H6"/></svg></span><span class="cart-fab-badge">0</span></button>
  <div id="custDrawer" class="cust-drawer"></div>
  <div id="previewSheet" class="preview-sheet"></div>
  <div id="qrSheet" class="qr-sheet"></div>
  <div id="shareSheet" class="share-sheet"></div>
  <div id="onboarding" class="onboarding"></div>
  <div id="palettePopup" class="palette-popup"></div>
  <div id="cmdPalette" class="cmd-palette" hidden aria-hidden="true"><div class="cmd-inner"><input id="cmdInput" type="text" placeholder="جستجوی دستور یا تب..." autocomplete="off"><div id="cmdList" class="cmd-list"></div></div></div>


  <div id="appSheet" class="app-sheet" aria-hidden="true"></div>

  <dialog id="authModal" class="dialog-card auth-modal bottom-sheet">
    <div class="auth-modal-content">
      <div class="auth-header">
        <h3 id="authTitle">ورود / ثبت‌نام</h3>
        <button type="button" class="close-btn" id="closeAuthModal" aria-label="بستن">✕</button>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-auth-tab="login">ورود</button>
        <button type="button" class="auth-tab" data-auth-tab="register">ثبت‌نام</button>
        <button type="button" class="auth-tab" data-auth-tab="telegram">تلگرام ⚡</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginUsername">ایمیل یا نام کاربری</label>
          <input type="text" id="loginUsername" placeholder="مثلاً: user@example.com یا john_doe" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPassword">رمز عبور</label>
          <input type="password" id="loginPassword" placeholder="******" required autocomplete="current-password" />
        </div>
        <div id="loginError" class="auth-error hidden"></div>
        <button type="submit" class="primary block-btn">ورود به حساب</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <div class="field">
          <label for="regUsername">نام کاربری (انگلیسی)</label>
          <input type="text" id="regUsername" placeholder="مثلاً: john_doe" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="regEmail">ایمیل (جهت ورود و بازیابی)</label>
          <input type="email" id="regEmail" placeholder="مثلاً: user@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="regFirstName">نام شما</label>
          <input type="text" id="regFirstName" placeholder="مثلاً: علی" />
        </div>
        <div class="field">
          <label for="regPassword">رمز عبور (حداقل ۶ کاراکتر)</label>
          <input type="password" id="regPassword" placeholder="******" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="regRefCode">کد معرف (اختیاری)</label>
          <input type="text" id="regRefCode" placeholder="کد معرف" />
        </div>
        <div id="regError" class="auth-error hidden"></div>
        <button type="submit" class="primary block-btn">ایجاد حساب کاربری</button>
      </form>

      <div id="telegramTab" class="auth-form hidden text-center">
        <p class="muted" style="margin-bottom: 12px; font-size: 14.5px;">ورود سریع بدون نیاز به رمز عبور با اکانت تلگرام:</p>
        <div id="tgWidgetContainer"></div>
      </div>

      <form id="otpVerificationForm" class="auth-form hidden text-center">
        <div style="margin-bottom: 12px;">
          <h4 style="margin: 0 0 6px 0; font-size: 16px; color: #fff;">کد تایید ایمیل 📩</h4>
          <p style="font-size: 14px; color: var(--muted); margin: 0; line-height: 1.5;">
            کد ۶ رقمی به ایمیل <strong id="otpEmailTarget" style="color: #fff;"></strong> ارسال شد.<br>
            <span style="color: #f59e0b; font-size: 13.5px; display: inline-block; margin-top: 4px;">⚠️ (لطفاً پوشه اسپم / Spam ایمیل خود را نیز بررسی کنید)</span>
          </p>
        </div>
        <div class="field">
          <input type="text" id="otpCodeInput" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]*" style="letter-spacing: 10px; font-size: 24px; font-weight: 900; text-align: center; width: 100%; box-sizing: border-box;" required />
        </div>
        <div id="otpError" class="auth-error hidden"></div>
        <button type="submit" class="primary block-btn">تایید و ورود به حساب</button>
        <button type="button" id="resendOtpBtn" class="secondary block-btn" style="margin-top: 6px; font-size: 14px;">ارسال مجدد کد تایید</button>
      </form>
    </div>
  </dialog>

  <div id="ptrIndicator" class="ptr-indicator">
    <svg class="ptr-svg" viewBox="0 0 40 40">
      <path class="ptr-path" d="M20 4 a16 16 0 1 1 0 32 a16 16 0 1 1 0 -32" />
    </svg>
  </div>
  <script defer src="ui-system.js?v=0"></script>
  <script defer src="purchase.js?v=0"></script>
  <script defer src="app.js?v=20261012-referral-settings-1"></script>
  <script defer src="motion.js?v=0"></script>
  <script defer src="final-polish.js?v=0"></script>
</body>
</html>
